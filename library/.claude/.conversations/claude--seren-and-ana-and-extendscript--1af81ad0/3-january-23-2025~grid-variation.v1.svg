<svg viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
    <!-- Background -->
    <rect width="800" height="800" fill="#FFD700"/>
    
    <!-- Vertical lines -->
    <g stroke="white" stroke-width="8" fill="none">
        <!-- 9 vertical wavy lines -->
        <path d="M 80,0 C 70,200 90,400 80,800"/>
        <path d="M 160,0 C 150,200 170,400 160,800"/>
        <path d="M 240,0 C 230,200 250,400 240,800"/>
        <path d="M 320,0 C 310,200 330,400 320,800"/>
        <path d="M 400,0 C 390,200 410,400 400,800"/>
        <path d="M 480,0 C 470,200 490,400 480,800"/>
        <path d="M 560,0 C 550,200 570,400 560,800"/>
        <path d="M 640,0 C 630,200 650,400 640,800"/>
        <path d="M 720,0 C 710,200 730,400 720,800"/>

        <!-- 9 horizontal wavy lines -->
        <path d="M 0,80 C 200,70 400,90 800,80"/>
        <path d="M 0,160 C 200,150 400,170 800,160"/>
        <path d="M 0,240 C 200,230 400,250 800,240"/>
        <path d="M 0,320 C 200,310 400,330 800,320"/>
        <path d="M 0,400 C 200,390 400,410 800,400"/>
        <path d="M 0,480 C 200,470 400,490 800,480"/>
        <path d="M 0,560 C 200,550 400,570 800,560"/>
        <path d="M 0,640 C 200,630 400,650 800,640"/>
        <path d="M 0,720 C 200,710 400,730 800,720"/>
    </g>
</svg>